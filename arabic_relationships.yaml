    usage:
      classical: "One of the most context-dependent terms in the classical lexicon: can mean patron, client, freed slave, ally, master, or kinsman depending entirely on context — early Islamic history's mawālī (non-Arab converts under patronage) is a major institution built on this term."
      modern: "Largely archaic outside historical/religious/legal discussion; 'mawlāya' ('my lord') survives in some address forms."
    likely_dimensions: [protection, obligation, authority, kinship (variable)]
    register: [Classical Arabic, historical usage]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Shares a root with walī (ar_wali) and shows the same problem of context-dependent polysemy taken even further — the mawālī institution is a strong example for the 'social structure' research question in the README."
    sources_to_consult: [Lane's Arabic-English Lexicon, Lisan al-Arab, early Islamic historical sources]
    evidence: []

