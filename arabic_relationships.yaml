    sources_to_consult: [Lane's Arabic-English Lexicon, Lisan al-Arab]
    evidence: []

  - id: ar_sahib
    language: Arabic
    script: صاحب
    transliteration: ṣāḥib
    root: ص-ح-ب
    morphology: "active participle (fāʿil) of ṣaḥiba, 'to accompany, keep company with'"
    glosses: [companion, associate, one who accompanies another, owner/holder (in compounds)]
    domains: [social association, companionship]
    usage:
      classical: "Broad term; 'the Companions' (al-Ṣaḥāba) denotes those who accompanied the Prophet — association/proximity, not necessarily intimacy."
      modern: "Everyday word for friend/companion; also used generically as 'owner of' or 'holder of' in compounds (ṣāḥib al-bayt, 'homeowner')."
    likely_dimensions: [companionship, variable intimacy]
    register: [Classical Arabic, Modern Standard Arabic, colloquial]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Broader than English 'friend' — the root sense is accompaniment/association, which can range from casual to very close."
    sources_to_consult: [Hans Wehr Dictionary of Modern Written Arabic, Lane's Arabic-English Lexicon]
    evidence: []

