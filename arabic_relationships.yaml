    register: [Classical Arabic, Modern Standard Arabic]
    example_usage: "حلف الفضول — Ḥilf al-Fuḍūl, a famous pre-Islamic alliance pact in Mecca"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Organized around alliance/commitment via formal oath rather than affection or intimacy — a clean contrast case against ḥabīb."
    sources_to_consult: [Hans Wehr Dictionary of Modern Written Arabic, Lane's Arabic-English Lexicon]
    evidence: []

