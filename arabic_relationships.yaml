# Arabic Relationship Concepts — Phase 2 dataset (see README.md "Next Step")
#
# Per the methodology: dimension SCORES are intentionally left null. This file
# only establishes spelling, transliteration, root, morphology, meaning,
# domain, classical/modern usage, and likely (qualitative) dimensions.
# `evidence` stays empty until claims are checked against the sources listed
# in `sources_to_consult` (Phase 4). `example_usage` is filled only where a
# well-attested collocation or Qur'anic/classical citation is already known;
# otherwise it is left null pending corpus work.

concepts:

  # ── STRANGER / OUTSIDER ─────────────────────────────────────────────
  - id: ar_gharib
    language: Arabic
    script: غريب
    transliteration: gharīb
    root: غ-ر-ب
    morphology: "faʿīl-pattern adjective/noun from gharaba, 'to be distant, to depart, to set (of the sun)'"
    glosses: [stranger, outsider, foreigner, unfamiliar person]
    domains: [stranger]
    usage:
      classical: "Denotes one outside the tribe/kin group; carries a sense of displacement, not merely unfamiliarity."
      modern: "General word for stranger/foreigner; also used adjectivally for 'strange, odd.'"
    likely_dimensions: [low familiarity, low intimacy]
    register: [Classical Arabic, Modern Standard Arabic]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Represents the low-familiarity boundary of the relationship space; a useful anchor point rather than a relationship type per se."
    sources_to_consult: [Hans Wehr Dictionary of Modern Written Arabic, Lane's Arabic-English Lexicon, Lisan al-Arab]
    evidence: []

  # ── SOCIAL ASSOCIATION / COMPANIONSHIP ──────────────────────────────
  - id: ar_jalis
