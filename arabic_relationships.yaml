    morphology: "faʿīl-pattern noun from jalasa, 'to sit'"
    glosses: [one who sits with you, social companion, conversational companion]
    domains: [social association, companionship]
    usage:
      classical: "Emphasizes the seated, conversational majlis (gathering/salon) context of companionship."
      modern: "Less common in everyday speech; retains the sense of a companion in conversation or a gathering."
    likely_dimensions: [companionship, low-to-moderate intimacy]
    register: [Classical Arabic]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
