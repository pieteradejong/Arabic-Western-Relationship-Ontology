    glosses: [companion, fellow, traveling companion]
    domains: [social association, companionship]
    usage:
      classical: "Often paired with travel/journey imagery (rafīq al-safar/al-darb, 'companion of the road')."
      modern: "Also adopted politically as 'comrade' in 20th-century Arab socialist/nationalist movements."
    likely_dimensions: [companionship, shared circumstance]
    register: [Classical Arabic, Modern Standard Arabic]
    example_usage: "رفيق الدرب — rafīq al-darb, 'companion of the path/journey'"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Emphasizes accompanying someone through a journey or shared circumstance rather than emotional closeness per se."
      - "Modern political sense ('comrade') is a distinct semantic layer worth tracking separately in the register field."
    sources_to_consult: [Hans Wehr Dictionary of Modern Written Arabic, Lane's Arabic-English Lexicon]
    evidence: []

