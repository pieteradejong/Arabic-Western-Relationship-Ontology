  - id: ar_anis
    language: Arabic
    script: أنيس
    transliteration: anīs
    root: أ-ن-س
    morphology: "faʿīl-pattern noun/adjective from anisa, 'to be sociable, feel at ease with'"
    glosses: [congenial companion, comforting companion, one whose presence dispels loneliness]
    domains: [friendship, companionship]
    usage:
      classical: "Same root as insān (human being) and uns (sociability/intimacy); describes companionship defined by the psychological comfort it produces."
      modern: "Also survives as a common given name (Anas/Anīs)."
    likely_dimensions: [emotional comfort, companionship, low formality]
    register: [Classical Arabic, Modern Standard Arabic]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Notable for describing the emotional effect of companionship (relief from loneliness) rather than a structural relationship category — a good candidate for a distinct 'affect produced' dimension."
    sources_to_consult: [Lane's Arabic-English Lexicon, Lisan al-Arab]
    evidence: []

  - id: ar_hamim
    language: Arabic
    script: حميم
    transliteration: ḥamīm
    root: ح-م-م
    morphology: "faʿīl-pattern adjective/noun; same root also yields ḥamīm, 'boiling water' (a Qur'anic homonym)"
    glosses: [intimate, close friend, very close companion]
    domains: [friendship]
    usage:
      classical: "Qur'anic: 'wa-lā ṣadīqin ḥamīm' (26:101), 'nor a close/intimate friend' — establishes ḥamīm as an intensifier of ṣadīq."
      modern: "Common collocation ṣadīq ḥamīm, 'close/intimate friend'; also used for close relatives."
    likely_dimensions: [high intimacy]
    register: [Classical Arabic, Qur'anic Arabic, Modern Standard Arabic]
    example_usage: "صديق حميم — ṣadīq ḥamīm, 'intimate/close friend' (cf. Qur'an 26:101)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The root's dual sense ('heat/closeness' and 'boiling water') is a striking case for the etymology-vs-meaning warning in the README — worth flagging, not over-interpreting."
      - "Functions largely as an intimacy intensifier on ṣadīq rather than a standalone category — relevant to how the graph ontology models STRONGER_INTIMACY_THAN edges."
    sources_to_consult: [Qur'anic concordance, Lane's Arabic-English Lexicon, Lisan al-Arab]
    evidence: []

  - id: ar_khalil
    language: Arabic
    script: خليل
    transliteration: khalīl
    root: خ-ل-ل
    morphology: "faʿīl-pattern noun from khalla, 'to penetrate, pass through' (via khilāl, 'in the midst of, through')"
    glosses: [intimate friend, deeply beloved friend, exceptionally close companion]
    domains: [friendship, affection]
    usage:
      classical: "'Khalīl Allāh' (Friend of God) is the classical epithet for the Prophet Ibrahim/Abraham — one of the strongest friendship concepts in the tradition."
      modern: "Still used for an intimate friend, though somewhat elevated/literary; 'Khalīl' is also a common given name."
    likely_dimensions: [very high intimacy, affection, exclusivity]
    register: [Classical Arabic, religious usage, Modern Standard Arabic]
    example_usage: "خليل الله — Khalīl Allāh, 'Friend of God' (epithet of Ibrahim/Abraham)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The religious epithet gives this term unusually strong, culturally loaded connotations — its ordinary and religious registers should probably be tracked as separate senses."
    sources_to_consult: [Qur'anic concordance, Lane's Arabic-English Lexicon, Lisan al-Arab]
    evidence: []

