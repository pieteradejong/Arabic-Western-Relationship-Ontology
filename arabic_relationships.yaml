  # ── ALLIANCE / LOYALTY / PROTECTION / TRUST ─────────────────────────
  - id: ar_wali
    language: Arabic
    script: ولي
    transliteration: walī
    root: و-ل-ي
    morphology: "faʿīl-pattern noun from waliya, 'to be near to, have charge/authority over'"
    glosses: [ally, protector, patron, guardian, supporter, saint (Sufi usage)]
    domains: [alliance, loyalty, protection, authority]
    usage:
      classical: "Extremely broad semantic field: legal guardian (walī al-amr), religious 'saint/friend of God' (walī Allāh), political ruler, or ally, depending entirely on context."
      modern: "Retains legal sense (guardian of a minor, walī al-amr) and religious sense (Sufi saint); less used for ordinary friendship."
    likely_dimensions: [protection, obligation, authority, variable intimacy]
    register: [Classical Arabic, religious usage, Modern Standard Arabic, legal usage]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The single strongest example in this dataset of why a one-dimensional friendship scale fails: a walī relationship can combine protection, loyalty, obligation, authority, and patronage without any of the intimacy or companionship implied by ṣadīq."
      - "Shares a root with mawlā (ar_mawla) — the two should be checked for historical divergence."
    sources_to_consult: [Qur'anic concordance, Hans Wehr Dictionary of Modern Written Arabic, Lane's Arabic-English Lexicon, classical fiqh glossaries]
    evidence: []

