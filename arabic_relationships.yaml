      - "Etymology is genuinely disputed in the classical lexicons — flag this rather than asserting a clean derivation from 'regret.'"
    sources_to_consult: [Lane's Arabic-English Lexicon, Lisan al-Arab]
    evidence: []

  - id: ar_qarin
