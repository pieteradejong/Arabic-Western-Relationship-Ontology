# English Relationship Concepts — Phase 3 dataset (see README.md "Next Step" / "Phase 3")
#
# Built INDEPENDENTLY of arabic_relationships.yaml: no entry here was chosen
# or defined by looking for a gloss of an Arabic term. The candidate list is
# the one already brainstormed from English usage in README.md's "Independent
# Western / English Ontology" section, expanded with each word's own
# etymology, register, and usage notes. Any resemblance between an English
# entry here and an Arabic entry elsewhere in this repo should be treated as
# a finding to investigate in Phase 6 (Universal Relationship Space mapping),
# not something assumed while building this file.
#
# Same conventions as arabic_relationships.yaml: `dimensions` stays null
# (no scores yet), `evidence` stays empty until checked against
# `sources_to_consult`, `example_usage` is filled only where a genuinely
# established usage/collocation is known.

concepts:

  # ── STRANGER / WEAK TIE ──────────────────────────────────────────────
  - id: en_stranger
    language: English
    lemma: stranger
    etymology: "Middle English via Old French estrangier < Latin extraneus, 'external, foreign' (root: extra, 'outside')"
    pos: noun
    glosses: [an unknown person, someone with no prior relationship to the speaker]
    domains: [stranger]
    usage:
      historical: "Historically carried a stronger sense of 'foreigner/outsider' (cf. 'strange land'), closer to legal/social outsider status than mere unfamiliarity."
      contemporary: "General word for any unfamiliar person; largely neutral, though 'stranger danger' framing gives it a mild wary connotation in modern usage."
    likely_dimensions: [low familiarity, low intimacy]
    register: [general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Functions as the low-familiarity anchor point of the English lexicon, parallel in role (not necessarily in meaning) to the low end of any relationship scale."
    sources_to_consult: [Oxford English Dictionary, Merriam-Webster]
    evidence: []

  - id: en_acquaintance
    language: English
    lemma: acquaintance
    etymology: "Middle English via Old French acointance < Latin ad- + cognitare, related to cognoscere, 'to come to know'"
    pos: noun
    glosses: [a person one knows slightly, short of friendship]
    domains: [weak tie]
    usage:
      historical: "Historically could denote a broader range of familiarity, including close political/social connections ('a person of my acquaintance')."
      contemporary: "Now specifically marks a relationship below the threshold of 'friend' — someone recognized and greeted but not confided in."
    likely_dimensions: [low intimacy, low companionship, recognition without closeness]
    register: [general, slightly formal]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Sits in a specific, well-defined slot in the modern English ladder model (stranger < acquaintance < friend) — a useful test case for whether that ladder model actually holds up once other dimensions are considered."
    sources_to_consult: [Oxford English Dictionary, Merriam-Webster]
    evidence: []

  - id: en_contact
    language: English
    lemma: contact
    etymology: "from Latin contactus, past participle of contingere, 'to touch, to be in touch with'"
    pos: noun
    glosses: [a person one knows and can reach for a specific purpose, typically professional]
    domains: [weak tie, professional network]
    usage:
      historical: "The physical sense ('a touching, a coming together') predates the personal-relationship sense by centuries."
      contemporary: "Modern usage as 'a person I can reach out to' is largely a 20th-century extension, strongly tied to professional networking ('I have a contact at that company')."
    likely_dimensions: [low intimacy, instrumental/transactional value, weak tie]
    register: [professional, general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Defines the relationship by its instrumental utility (a means of reaching someone or something) rather than by any emotional or social content — a genuinely distinct dimension from acquaintance, which is about recognition/familiarity rather than utility."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_connection
    language: English
    lemma: connection
    etymology: "from Latin connectere, 'to bind together' (com- + nectere, 'to bind')"
    pos: noun
    glosses: [a person linked to another through network, background, or influence]
    domains: [weak tie, professional network]
    usage:
      historical: "General sense of 'a link or relation' between people or things is old and broad."
      contemporary: "Specific modern sense — 'she has connections' / a LinkedIn 'connection' — narrows this to networked, often instrumental, social/professional ties."
    likely_dimensions: [low intimacy, instrumental value, network position]
    register: [professional, general, digitally mediated]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The platform-specific sense (a LinkedIn 'connection') is worth tracking as a distinct modern register from the older general sense — see also en_mutual and en_follower for the same digital-mediation pattern."
    sources_to_consult: [Oxford English Dictionary, contemporary usage corpora (social media)]
    evidence: []

  # ── PROXIMITY ─────────────────────────────────────────────────────────
  - id: en_neighbor
    language: English
    lemma: neighbor
    etymology: "Old English neahgebur, compound of neah ('near') + gebur ('dweller, farmer') — literally 'near-dweller'"
    pos: noun
    glosses: [a person who lives near you]
    domains: [proximity]
    usage:
      historical: "Old English compound already lexicalized the 'near + dweller' concept directly; carried strong communal/mutual-aid connotations in agrarian society."
      contemporary: "Retains a residual social-obligation connotation ('be a good neighbor,' 'neighborly') alongside the purely locational sense, though weaker than in earlier usage."
    likely_dimensions: [proximity, weak-to-moderate obligation, variable intimacy]
    register: [general]
    example_usage: "'good neighbor policy' / 'neighborly' (retains an ethical-obligation shade absent from purely locational synonyms)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The compound etymology (near + dweller) shows the concept was lexicalized transparently rather than borrowed — worth comparing register decay over time (agrarian obligation sense vs. modern urban-anonymity usage) as a historical-change question."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  # ── INSTITUTIONAL / PROFESSIONAL ASSOCIATION ────────────────────────
  - id: en_associate
    language: English
    lemma: associate
    etymology: "from Latin associare, 'to join with' (ad- + sociare, from socius, 'ally, companion')"
    pos: noun
    glosses: [a person one works or deals with, without implying friendship]
    domains: [professional association]
    usage:
      historical: "Latin socius (companion/ally/partner) is a notably warmer root than the modern English derivative's cool, business-register usage suggests."
      contemporary: "Deliberately non-intimate: 'business associate' explicitly excludes/brackets off any personal-friendship claim."
    likely_dimensions: [low intimacy, formality, professional obligation]
    register: [professional, formal]
    example_usage: "'business associate' (a fixed collocation that explicitly marks the relationship as non-personal)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The gap between the warm Latin root (socius, 'companion, ally') and the cool modern English sense is a clean case of semantic narrowing over time, worth flagging for the historical-change research question."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_colleague
    language: English
    lemma: colleague
    etymology: "from Middle French collègue < Latin collega, 'partner in office' (com- + legare, 'to depute, to send as ambassador')"
    pos: noun
    glosses: [a fellow member of a profession, workplace, or organization]
    domains: [professional association]
    usage:
      historical: "Latin collega specifically denoted co-officeholders (e.g. Roman consuls), an institutional-peer sense from the start."
      contemporary: "General word for a co-worker, especially in white-collar/professional register; slightly more formal than 'coworker.'"
    likely_dimensions: [low-to-moderate intimacy, institutional context, formality]
    register: [professional, formal]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Institutional-peer sense has been remarkably stable from Latin co-officeholder to modern workplace peer — a case where the semantic domain hasn't shifted much over two millennia."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_coworker
    language: English
    lemma: coworker
    etymology: "native English compound, co- (Latin-derived prefix, 'together') + worker (Old English wyrcan, 'to work')"
    pos: noun
    glosses: [a person who works at the same organization or on the same tasks]
    domains: [professional association]
    usage:
      historical: "A comparatively recent compound; not attested with high frequency until industrial/modern white- and blue-collar workplace culture."
      contemporary: "More casual/neutral register than 'colleague'; used across all job types, not just professional ones."
    likely_dimensions: [low-to-moderate intimacy, institutional context, informal-to-neutral formality]
    register: [general, informal-to-neutral]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Near-synonym of colleague but with a register split (colleague = more formal/professional, coworker = more general/casual) worth capturing as a formality-axis distinction rather than treating the pair as fully interchangeable."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_peer
    language: English
    lemma: peer
    etymology: "Middle English via Old French per < Latin par, 'equal'"
    pos: noun
    glosses: [a person of equal standing — in age, rank, ability, or social status]
    domains: [professional association, social status]
    usage:
      historical: "Legal/aristocratic sense ('peer of the realm') long predates the general social-equality sense."
      contemporary: "Widely used for status-matched relationships across contexts: 'peer review,' 'peer pressure,' 'peer group' — defined by equality of standing rather than by any specific institution."
    likely_dimensions: [equality of status, low-to-moderate intimacy, variable companionship]
    register: [general, professional, academic]
    example_usage: "'peer review,' 'peer pressure' (fixed collocations built on the equality sense)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Unusual in this list for being defined purely by a structural property (equality of rank/status) rather than by companionship, affection, or institution — arguably names a dimension (status-parity) rather than a relationship type in its own right."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_classmate
    language: English
    lemma: classmate
    etymology: "compound, class (Latin classis, 'a group called to service/assembly') + mate (Middle Low German gemate, 'one eating at the same table, a messmate')"
    pos: noun
    glosses: [a person in the same school class]
    domains: [institutional association]
    usage:
      historical: "'Mate' compounds (classmate, roommate, teammate) are a productive Germanic word-formation pattern in English, all built on the older 'one who shares a table/mess' sense of mate."
      contemporary: "Neutral, institution-bound term; carries no inherent intimacy claim beyond shared institutional context."
    likely_dimensions: [institutional context, low-to-moderate companionship, bounded duration]
    register: [general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Part of a productive 'mate' compound family (classmate/roommate/teammate) that all encode 'shared context' via the same root sense of commensality (eating together) rather than via emotional vocabulary — a structural pattern worth tracking across the three entries."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_roommate
    language: English
    lemma: roommate
    etymology: "compound, room (Old English rum, 'space') + mate (see en_classmate)"
    pos: noun
    glosses: [a person who shares a place of residence, without implying romantic or family ties]
    domains: [institutional/domestic association]
    usage:
      historical: "Rises with urban, non-familial shared housing (university dormitories, city apartment-sharing) — a relationship category presupposing housing patterns that didn't exist in the same form earlier."
      contemporary: "Explicitly used to rule out a romantic/family reading of shared housing ('we're just roommates')."
    likely_dimensions: [shared domestic proximity, bounded duration, explicitly non-romantic/non-familial]
    register: [general, informal]
    example_usage: "'we're just roommates' (a fixed disclaimer construction ruling out a romantic reading)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "A socially/economically contingent category — its productivity depends on a housing pattern (co-residence without kinship or marriage) that is itself a specific modern social arrangement, worth flagging for the 'Social Structure' research question."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_teammate
    language: English
    lemma: teammate
    etymology: "compound, team (Old English team, 'family, group of draft animals') + mate (see en_classmate)"
    pos: noun
    glosses: [a fellow member of the same team]
    domains: [institutional association]
    usage:
      historical: "'Team' originally denoted a set of draft animals harnessed together before extending to human cooperative groups."
      contemporary: "Neutral, activity-bound term (sports, work teams); can carry a moderate companionship/loyalty charge in competitive contexts without implying broader friendship."
    likely_dimensions: [shared purpose/activity, moderate obligation (to the team), bounded duration]
    register: [general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Distinguished from classmate/roommate in this family by an explicit shared-purpose/goal component (winning, completing a project), which the dataset should capture as a distinct sub-dimension of companionship."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  # ── COMPANIONSHIP / FRIENDSHIP GRADIENT ─────────────────────────────
  - id: en_companion
    language: English
    lemma: companion
    etymology: "Middle English via Old French compaignon < Late Latin companio, literally com- ('together') + panis ('bread') — 'one who shares bread with you'"
    pos: noun
    glosses: [a person who accompanies or spends time with another]
    domains: [companionship]
    usage:
      historical: "Root sense (bread-sharing) grounds companionship in a shared, concrete act rather than in a feeling — structurally similar in kind (though not meaning) to how several Arabic companionship terms are grounded in shared activity."
      contemporary: "General word for someone who accompanies you (a travel companion, a life companion); softer and vaguer than 'friend,' can imply less or more intimacy depending on context."
    likely_dimensions: [companionship, variable intimacy and duration]
    register: [general, slightly literary]
    example_usage: "'travel companion,' 'lifelong companion'"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The bread-sharing etymology is a strong example of a relationship term grounded in a concrete shared activity rather than in emotional vocabulary — worth flagging as a language-internal (English) instance of the activity-based-companionship pattern, independent of any cross-linguistic comparison."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_friend
    language: English
    lemma: friend
    etymology: "Old English freond, originally the present participle of freogan, 'to love, to favor' (Germanic root also giving 'free')"
    pos: noun
    glosses: [a person one knows well and regards with affection, loyalty, and trust]
    domains: [friendship]
    usage:
      historical: "Etymologically a verbal participle ('one who loves/favors') rather than a noun naming a fixed social role — the word itself encodes an ongoing relation, not a status."
      contemporary: "The unmarked, general word for the category; English marks intensity almost entirely through pre-posed adjectives (close/best/casual friend) rather than through distinct lexical roots."
    likely_dimensions: [intimacy, affection, companionship, trust]
    register: [general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The single most important structural fact about the English friendship lexicon for this project: English overwhelmingly marks degree of closeness analytically (adjective + friend) rather than through separate lexemes — see en_close_friend, en_best_friend, en_casual_friend, en_buddy, en_pal below for how that plays out."
      - "Also now productive as a verb ('to friend someone' on social media) — a distinctly 21st-century extension worth noting under register."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_close_friend
    language: English
    lemma: close friend
    etymology: "analytic construction: close (Middle English clos < Latin clausus, 'shut, near') + friend (see en_friend)"
    pos: "adjective + noun phrase"
    glosses: [a friend marked by high intimacy and emotional closeness]
    domains: [friendship]
    usage:
      historical: null
      contemporary: "Standard way to intensify 'friend' along the intimacy axis; 'close' itself is a spatial-nearness metaphor extended to emotional nearness, parallel to en_neighbor's spatial-nearness root but applied metaphorically rather than literally."
    likely_dimensions: [high intimacy, high affection]
    register: [general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Not a separate lexeme but a fixed adjective+noun intensification pattern — kept as its own entry because the README's original candidate list treats it as a distinct category, but it should be modeled as a MODIFIES/INTENSIFIES edge on 'friend' in the graph ontology rather than as an independent node."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_best_friend
    language: English
    lemma: best friend
    etymology: "analytic construction: best (Old English betst, superlative of god, 'good') + friend"
    pos: "adjective + noun phrase"
    glosses: [one's closest, most trusted friend, typically singular/exclusive]
    domains: [friendship]
    usage:
      historical: null
      contemporary: "Marks both maximal intensity and, often, exclusivity/singularity (implying a ranked 'best' among all friends) — the abbreviation 'BFF' (best friends forever) adds a duration/permanence claim not present in 'best friend' alone."
    likely_dimensions: [maximal intimacy, exclusivity, claimed permanence]
    register: [general, informal (especially 'BFF')]
    example_usage: "'BFF' (best friends forever) — adds an explicit duration/permanence claim absent from the base phrase"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The superlative form ('best') builds in a ranking/exclusivity claim that 'close friend' does not make — worth keeping intimacy and exclusivity as separate sub-dimensions here rather than treating this as simply 'more of' close friend."
    sources_to_consult: [Oxford English Dictionary, contemporary usage corpora]
    evidence: []

  - id: en_casual_friend
    language: English
    lemma: casual friend
    etymology: "analytic construction: casual (Latin casualis, 'happening by chance,' from casus, 'fall, chance') + friend"
    pos: "adjective + noun phrase"
    glosses: [a friend known lightly, without deep intimacy or regular deliberate contact]
    domains: [friendship, weak tie]
    usage:
      historical: null
      contemporary: "Marks a friend relationship that is real (crosses the acquaintance threshold) but low-intensity — occupies a middle zone between acquaintance and (unmarked) friend."
    likely_dimensions: [low-to-moderate intimacy, low obligation]
    register: [general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Its etymological root (casualis, 'by chance') is semantically apt — it marks the relationship as having arisen incidentally rather than been deliberately cultivated, a genuine additional dimension (intentionality/origin) beyond simple intimacy-intensity."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_buddy
    language: English
    lemma: buddy
    etymology: "origin uncertain; possibly an alteration of 'brother,' or from British dialectal 'butty' (a workmate/fellow laborer)"
    pos: noun
    glosses: [an informal, friendly companion]
    domains: [friendship]
    usage:
      historical: "First clearly attested in 19th-century American English; the 'butty'/workmate hypothesis would tie it to shared-labor companionship, similar in structure (not meaning) to teammate."
      contemporary: "Informal, warm, low-stakes register; also used as a direct address term to a stranger ('hey, buddy') independent of any actual friendship."
    likely_dimensions: [companionship, informality, low-to-moderate intimacy]
    register: [informal, colloquial]
    example_usage: "'hey, buddy' (used as a direct address to a stranger, decoupled from the friendship sense entirely)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "The address-term usage ('hey, buddy' to a total stranger) is a genuinely distinct sense from the relationship-noun sense and should probably be tracked as a separate function (vocative/address) rather than conflated with the friendship-intensity sense."
    sources_to_consult: [Oxford English Dictionary, Merriam-Webster]
    evidence: []

  - id: en_pal
    language: English
    lemma: pal
    etymology: "from Angloromani/Romani pal, 'brother, friend,' ultimately from Sanskrit bhrātā, 'brother' (via Romani migration)"
    pos: noun
    glosses: [a close, informal friend]
    domains: [friendship]
    usage:
      historical: "A comparatively rare case of a core English relationship word borrowed from Romani (via Romani-speaking communities in Britain), rather than inherited from Old English or borrowed from Latin/French."
      contemporary: "Informal, somewhat dated-sounding in casual speech ('pen pal' survives more robustly than standalone 'pal' in everyday use)."
    likely_dimensions: [companionship, informality, moderate intimacy]
    register: [informal, somewhat dated]
    example_usage: "'pen pal' (a specific, still-productive compound denoting a friend maintained purely through correspondence)"
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Its Romani/Sanskrit etymology (ultimately 'brother') is a striking parallel: multiple unrelated language families independently extend a literal kinship term ('brother') to close non-kin friendship — worth noting as a cross-linguistic pattern to investigate later, without assuming it links specifically to Arabic akh."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  # ── INTIMACY / DISCLOSURE ────────────────────────────────────────────
  - id: en_confidant
    language: English
    lemma: confidant
    etymology: "French confident/confidente < Italian confidente < Latin confidere, 'to trust fully' (com- + fidere, 'to trust')"
    pos: noun
    glosses: [a person one trusts with private thoughts, secrets, or feelings]
    domains: [intimacy, trust]
    usage:
      historical: "Entered English via French/Italian in the 17th century, specifically naming the trust/disclosure function rather than general companionship."
      contemporary: "Defines the relationship purely by the function of receiving private disclosure — a person can be a confidant without being a frequent companion at all."
    likely_dimensions: [high intimacy, trust, low requirement of companionship or duration]
    register: [general, slightly formal/literary]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Notably decouples intimacy/trust from companionship — a useful test case for the README's claim that 'a confidant can have high trust and intimacy without frequent companionship.'"
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  # ── MENTORSHIP / HIERARCHY ──────────────────────────────────────────
  - id: en_mentor
    language: English
    lemma: mentor
    etymology: "from Mentor, the name of a character in Homer's Odyssey who guides Telemachus — a proper noun that became a common noun"
    pos: noun
    glosses: [an experienced advisor who guides a less experienced person]
    domains: [mentorship, hierarchy]
    usage:
      historical: "The eponymous origin (a specific literary character) is unusual among relationship terms in this list, most of which derive from verbs or compounds rather than proper names."
      contemporary: "Standard word for a guiding, asymmetric-but-supportive relationship in professional, academic, and personal-development contexts."
    likely_dimensions: [asymmetric obligation, guidance, moderate intimacy, duration]
    register: [general, professional]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "Eponymous origin from a literary character is a distinct etymological category (proper-noun lexicalization) worth tracking separately from the Old English/Latin/French-derived majority of this dataset."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_mentee
    language: English
    lemma: mentee
    etymology: "back-formation from mentor, using the productive English -ee suffix (patient/recipient marker, as in 'employee')"
    pos: noun
    glosses: [a person being guided by a mentor]
    domains: [mentorship, hierarchy]
    usage:
      historical: "A recent coinage (attested mainly from the mid-20th century), formed by analogy rather than inherited or borrowed."
      contemporary: "Standard counterpart to 'mentor'; 'protégé' (French protégé, 'protected one,' from protéger) is a near-synonym with a slightly more formal/dated register."
    likely_dimensions: [asymmetric obligation, guidance, moderate intimacy]
    register: [professional, general]
    example_usage: null
    dimensions: {intimacy: null, affection: null, kinship: null, obligation: null, protection: null, duration: null, companionship: null, formality: null}
    notes:
      - "A clean case of morphological productivity: the -ee suffix pattern (employee, trainee, mentee) shows English can mint a new relationship-role word on demand from an existing root, rather than needing a distinct lexeme."
    sources_to_consult: [Oxford English Dictionary]
    evidence: []

  - id: en_patron
    language: English
    lemma: patron
    etymology: "Middle English via Old French patron < Latin patronus, 'protector, defender' (from pater, 'father')"
    pos: noun
    glosses: [a person who supports, funds, or protects another, an institution, or an artist]
    domains: [alliance, protection, hierarchy]
